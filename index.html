<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F55D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アニメ英語">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>アニメ英語ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --ink: #1B2130;
  --muted: #646B7A;
  --line: #DADDE5;
  --accent: #2F55D4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6ECFD;
  --good: #1F7A52;
  --good-soft: #E3F4EC;
  --bad: #B83A33;
  --bad-soft: #FBE9E7;
  --mark: #FFEFAE;
  --sans: "IBM Plex Sans", "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #11141B; --surface: #1A1E28; --ink: #E7E9EF; --muted: #9AA1B0; --line: #2C3240;
    --accent: #8EA5FF; --accent-ink: #0F1320; --accent-soft: #232C4A;
    --good: #5CC898; --good-soft: #173328; --bad: #F08A80; --bad-soft: #3A1E1C; --mark: #4A4120;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11141B; --surface: #1A1E28; --ink: #E7E9EF; --muted: #9AA1B0; --line: #2C3240;
  --accent: #8EA5FF; --accent-ink: #0F1320; --accent-soft: #232C4A;
  --good: #5CC898; --good-soft: #173328; --bad: #F08A80; --bad-soft: #3A1E1C; --mark: #4A4120;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  padding-inline: 16px;
}
.app { max-width: 560px; margin: 0 auto; padding-block: 24px 56px; display: grid; gap: 24px; }

header { display: grid; gap: 2px; }
.app-name { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 0; }
.ep-pick { position: relative; display: block; }
.ep-pick select {
  appearance: none; -webkit-appearance: none; width: 100%;
  font: inherit; font-size: 22px; font-weight: 700; line-height: 1.4; color: var(--ink);
  background: none; border: 0; padding: 0 28px 0 0; cursor: pointer; text-overflow: ellipsis;
}
.ep-pick::after {
  content: ""; position: absolute; right: 6px; top: 50%; width: 9px; height: 9px; margin-top: -7px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); pointer-events: none;
}
.show { margin: 0; font-size: 13px; color: var(--muted); }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.steps button {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  padding: 10px 4px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer;
  display: flex; justify-content: center; align-items: center; gap: 6px;
}
.steps button .n { font-family: var(--mono); font-size: 12px; }
.steps button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.steps .tick { color: var(--good); font-size: 13px; }

main { display: grid; gap: 20px; }
.h { font-size: 18px; margin: 0; font-weight: 700; text-wrap: balance; }
.lead { margin: 0; }
.muted { color: var(--muted); }

.progress { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 24px 20px; display: grid; gap: 14px;
}
.kind { justify-self: start; font-size: 12px; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 8px; }
.word-row { display: flex; align-items: center; gap: 10px; }
.word { font-size: 40px; line-height: 1.15; font-weight: 600; margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
.word.phrase { font-size: 28px; }
.count { margin: -6px 0 0; font-size: 13px; color: var(--muted); }
.meaning { margin: 0; font-size: 22px; font-weight: 700; }
.note { margin: 0; font-size: 14px; color: var(--muted); }

.line { margin: 0; display: grid; gap: 4px; padding-top: 14px; border-top: 1px solid var(--line); }
.line + .line { margin-top: 2px; }
.line figcaption { display: flex; gap: 10px; font-size: 12px; color: var(--muted); }
.tc { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.line .en { margin: 0; font-size: 17px; line-height: 1.55; }
.line .ja { margin: 0; font-size: 14px; color: var(--muted); }
mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }

.spk {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center;
  cursor: pointer; flex: none; padding: 0; vertical-align: middle;
}
.spk.small { width: 28px; height: 28px; margin-left: 4px; }
.spk svg { width: 18px; height: 18px; }
.spk.small svg { width: 14px; height: 14px; }
.no-speech .spk { display: none; }

.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.btn {
  appearance: none; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 12px 16px; text-align: center; text-decoration: none; display: block;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.wide { width: 100%; }
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.wlist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wl-en { font-weight: 600; flex: 0 1 11em; }
.wl-ja { flex: 1; color: var(--muted); font-size: 15px; }

.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.rules li { display: grid; gap: 0; }
.rules b { font-size: 17px; }
.rules span { font-size: 14px; color: var(--muted); }
.setting { margin: 0; font-size: 14px; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; }

.formula { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 17px; }
.formula span { padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.formula .plus { border: 0; background: none; padding: 0; color: var(--muted); }
.formula small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.points { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: 15px; }
.section-label { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 4px 0 -8px; }

.q-prompt { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.45; }
.q-prompt.big { font-size: 34px; }
.q-prompt.mid { font-size: 26px; }
.choices { display: grid; gap: 10px; }
.choices .btn { text-align: left; }
.choices .btn:disabled { opacity: 1; color: var(--muted); }
.choices .btn.ok { background: var(--good-soft); border-color: var(--good); color: var(--ink); }
.choices .btn.ng { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); }
.verdict { margin: 0; font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.ng { color: var(--bad); }

.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score dl { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.score dt { font-size: 12px; color: var(--muted); }
.score dd { margin: 0; font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* 合言葉・更新のお知らせ */
.lock { display: grid; gap: 14px; margin-top: 24px; }
.lock h1 { margin: 0; font-size: 22px; }
.lock p { margin: 0; }
.pass { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.update {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: 528px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 16px; font-weight: 700;
}

@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .25s ease; }
}
</style>

</head>
<body>
<div class="app" id="app">
  <header id="head" hidden>
    <p class="app-name">アニメ英語ノート</p>
    <label class="ep-pick"><span hidden>話を選ぶ</span><select id="ep-select" aria-label="話を選ぶ"></select></label>
    <p class="show" id="show"></p>
  </header>
  <nav class="steps" id="steps" aria-label="学習の流れ" hidden></nav>
  <main id="view"></main>
</div>

<script>
(() => {
let EPISODES = [];

/* ===== 保存（この端末のブラウザだけ） ===== */
const KEY = "anime-eigo:v2";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let S = load() || {};
S.step = S.step && typeof S.step === "object" ? S.step : {};
S.done = S.done || {};
S.scores = S.scores || {};

let R = {};
const resetRun = () => { R = { card: 0, revealed: false, phase: "grammar", quiz: null, missed: [], gScore: null }; };
resetRun();

/* ===== 小道具 ===== */
const ep = () => EPISODES.find(e => e.id === S.ep);
const stepOf = () => S.step[S.ep] || "before";
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const markText = (text, src) => esc(text).replace(new RegExp(`\\b(${src})\\b`, "gi"), "<mark>$1</mark>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const doneKey = (k, id = S.ep) => `${id}:${k}`;
const KIND = { word: "単語", phrase: "決まり文句" };

const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const spk = (text, cls = "") => `<button class="spk ${cls}" data-say="${esc(text.replace("〜", "something"))}" aria-label="英語の発音を聞く">${SPK}</button>`;

const hasSpeech = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
if (!hasSpeech) document.documentElement.classList.add("no-speech");
function say(text) {
  if (!hasSpeech) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang === "en-US");
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

const lineBlock = (l, hl) => `
  <figure class="line">
    <figcaption><span class="tc">${esc(l.t)}</span>${l.who ? `<span>${esc(l.who)}</span>` : ""}</figcaption>
    <p class="en" lang="en">${markText(l.en, hl)}${spk(l.en, "small")}</p>
    <p class="ja">${esc(l.ja)}</p>
  </figure>`;

const wordList = items => `
  <ul class="wlist">${items.map(w => `
    <li><span class="wl-en" lang="en">${esc(w.en)}</span><span class="wl-ja">${esc(w.ja)}</span>${spk(w.en, "small")}</li>`).join("")}
  </ul>`;

/* ===== 画面 ===== */
const STEPS = [["before", "見る前"], ["watch", "見る"], ["after", "見たあと"]];

function renderHead() {
  const sel = document.getElementById("ep-select");
  sel.innerHTML = EPISODES.map(e =>
    `<option value="${esc(e.id)}" ${e.id === S.ep ? "selected" : ""}>${esc(e.ep)} ${esc(e.title)}${S.done[doneKey("after", e.id)] ? "　✓" : ""}</option>`).join("");
  document.getElementById("show").textContent = ep().show;
  document.getElementById("steps").innerHTML = STEPS.map(([k, label], i) => `
    <button data-step="${k}" ${stepOf() === k ? 'aria-current="step"' : ""}>
      <span class="n">${i + 1}</span>${label}${S.done[doneKey(k)] ? '<span class="tick" aria-label="済み">✓</span>' : ""}
    </button>`).join("");
}

function viewBefore(e) {
  const n = e.items.length;
  if (R.card >= n) {
    S.done[doneKey("before")] = true; save();
    return `
      <h2 class="h">見る前の${n}個</h2>
      <p class="section-label">単語</p>
      ${wordList(e.items.filter(w => w.kind === "word"))}
      <p class="section-label">決まり文句</p>
      ${wordList(e.items.filter(w => w.kind === "phrase"))}
      <div class="row">
        <button class="btn" data-act="cards-again">もう一度カードで</button>
        <button class="btn primary" data-act="go" data-to="watch">見るへ進む</button>
      </div>`;
  }
  const w = e.items[R.card];
  return `
    <div class="progress"><span>${R.card + 1} / ${n}</span><div class="bar"><i style="width:${(R.card + 1) / n * 100}%"></i></div></div>
    <article class="card">
      <span class="kind">${KIND[w.kind]}</span>
      <div class="word-row"><h2 class="word ${w.kind}" lang="en">${esc(w.en)}</h2>${spk(w.en)}</div>
      <p class="count">この話で${w.count}回</p>
      ${R.revealed ? `
        <p class="meaning">${esc(w.ja)}</p>
        ${w.note ? `<p class="note">${esc(w.note)}</p>` : ""}
        ${lineBlock(w.line, w.hl)}
      ` : `<button class="btn primary wide" data-act="reveal">意味を見る</button>`}
    </article>
    <div class="row">
      <button class="btn" data-act="prev" ${R.card === 0 ? "disabled" : ""}>前へ</button>
      <button class="btn ${R.revealed ? "primary" : ""}" data-act="next">${R.card === n - 1 ? `${n}個おわり` : "次へ"}</button>
    </div>`;
}

function viewWatch(e) {
  return `
    <h2 class="h">英語音声・英語字幕で見る</h2>
    <ul class="rules">
      <li><b>止めない</b><span>分からない所があっても、そのまま進める</span></li>
      <li><b>調べない</b><span>辞書もこのアプリも開かない</span></li>
      <li><b>流す</b><span>話の流れは日本語で一度見て知っている。それで十分</span></li>
    </ul>
    <p class="setting">Netflixの「音声と字幕」で、音声を<b>英語</b>、字幕を<b>英語</b>にする</p>
    <a class="btn primary wide" href="${esc(e.netflix)}" target="_blank" rel="noopener">Netflixで${esc(e.ep)}を開く</a>
    <button class="btn wide" data-act="watched">見終わった</button>`;
}

function makeQuiz(kind, e) {
  if (kind === "grammar") {
    return { kind, title: "文法チェック", i: 0, score: 0, picked: null, missed: [],
      items: e.grammar.quiz.map(q => ({ prompt: q.prompt, sub: q.sub, answer: q.choices[0], choices: shuffle(q.choices) })) };
  }
  return { kind, title: "単語チェック", i: 0, score: 0, picked: null, missed: [],
    items: shuffle(e.items).map(w => {
      const others = shuffle(e.items.filter(o => o !== w)).slice(0, 3).map(o => o.ja);
      return { prompt: w.en, size: w.kind === "phrase" ? "mid" : "big", say: w.en, answer: w.ja, choices: shuffle([w.ja, ...others]), word: w };
    }) };
}

function viewQuiz() {
  const q = R.quiz, it = q.items[q.i], n = q.items.length;
  const picked = q.picked;
  return `
    <div class="progress"><span>${q.title} ${q.i + 1} / ${n}</span><div class="bar"><i style="width:${(q.i + 1) / n * 100}%"></i></div></div>
    <div class="word-row">
      <p class="q-prompt ${it.size || ""}" ${/^[\x00-\x7F]+$/.test(it.prompt) ? 'lang="en"' : ""}>${esc(it.prompt)}</p>
      ${it.say ? spk(it.say) : ""}
    </div>
    ${it.sub ? `<p class="lead muted" style="margin-top:-12px">${esc(it.sub)}</p>` : ""}
    <div class="choices">${it.choices.map((c, i) => {
      let cls = "";
      if (picked !== null) { if (c === it.answer) cls = "ok"; else if (i === picked) cls = "ng"; }
      return `<button class="btn ${cls}" data-choice="${i}" ${picked !== null ? "disabled" : ""}>${esc(c)}</button>`;
    }).join("")}</div>
    ${picked !== null ? `
      <p class="verdict ${it.choices[picked] === it.answer ? "ok" : "ng"}">${it.choices[picked] === it.answer ? "正解" : `正解は「${esc(it.answer)}」`}</p>
      <button class="btn primary wide" data-act="quiz-next">${q.i === n - 1 ? "結果へ" : "次へ"}</button>` : ""}`;
}

function viewAfter(e) {
  const g = e.grammar;
  if (R.phase === "grammar") return `
    <h2 class="h">今日の文法　<span lang="en">${esc(g.name)}</span></h2>
    <p class="lead">${esc(g.lead)}</p>
    <div class="formula" lang="en">${g.formula.map(([a, b]) => `<span>${esc(a)}${b ? `<small>${esc(b)}</small>` : ""}</span>`).join('<span class="plus">+</span>')}</div>
    <ul class="points">${g.points.map(p => `<li>${p}</li>`).join("")}</ul>
    <p class="section-label">この話のセリフ</p>
    <div>${g.examples.map(x => lineBlock(x, g.hl)).join("")}</div>
    <button class="btn primary wide" data-act="start-quiz" data-kind="grammar">確認する（${g.quiz.length}問）</button>`;

  if (R.phase === "quiz") return viewQuiz();

  if (R.phase === "between") return `
    <h2 class="h">文法チェック ${R.gScore} / ${g.quiz.length}</h2>
    <p class="lead">次は、見る前に覚えた単語と決まり文句を確認する。1分で終わる。</p>
    <button class="btn primary wide" data-act="start-quiz" data-kind="words">単語チェック（${e.items.length}問）</button>`;

  const sc = S.scores[S.ep] || {};
  return `
    <h2 class="h">${esc(e.ep)} おわり</h2>
    <div class="score">
      <dl><dt>文法</dt><dd>${sc.g ?? "-"} / ${g.quiz.length}</dd></dl>
      <dl><dt>単語・決まり文句</dt><dd>${sc.w ?? "-"} / ${e.items.length}</dd></dl>
    </div>
    ${R.missed.length ? `<p class="section-label">見直す言葉</p>${wordList(R.missed)}` : `<p class="lead">全問正解。</p>`}
    <button class="btn wide" data-act="after-again">見たあとをもう一度</button>`;
}

function render() {
  const e = ep();
  renderHead();
  const v = { before: viewBefore, watch: viewWatch, after: viewAfter }[stepOf()](e);
  document.getElementById("view").innerHTML = v;
}

const setStep = k => { S.step[S.ep] = k; save(); };

/* ===== 操作 ===== */
document.getElementById("ep-select").addEventListener("change", ev => {
  S.ep = ev.target.value; save(); resetRun(); render(); window.scrollTo(0, 0);
});

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-say],[data-step],[data-act],[data-choice]");
  if (!t || !EPISODES.length) return;
  const e = ep();

  if (t.dataset.say) { say(t.dataset.say); return; }

  if (t.dataset.step) {
    setStep(t.dataset.step);
    if (t.dataset.step === "before" && R.card >= e.items.length) R.card = 0;
    render(); window.scrollTo(0, 0); return;
  }

  if (t.dataset.choice !== undefined) {
    const q = R.quiz; if (q.picked !== null) return;
    q.picked = Number(t.dataset.choice);
    const it = q.items[q.i];
    if (it.choices[q.picked] === it.answer) q.score++;
    else if (it.word) q.missed.push(it.word);
    render(); return;
  }

  switch (t.dataset.act) {
    case "reveal": R.revealed = true; break;
    case "prev": R.card = Math.max(0, R.card - 1); R.revealed = false; break;
    case "next": R.card++; R.revealed = false; break;
    case "cards-again": R.card = 0; R.revealed = false; break;
    case "go": setStep(t.dataset.to); window.scrollTo(0, 0); break;
    case "watched":
      S.done[doneKey("watch")] = true; setStep("after"); R.phase = "grammar"; window.scrollTo(0, 0); break;
    case "start-quiz":
      R.quiz = makeQuiz(t.dataset.kind, e); R.phase = "quiz"; window.scrollTo(0, 0); break;
    case "quiz-next": {
      const q = R.quiz;
      if (q.i < q.items.length - 1) { q.i++; q.picked = null; break; }
      if (q.kind === "grammar") { R.gScore = q.score; R.phase = "between"; break; }
      S.scores[S.ep] = { g: R.gScore, w: q.score };
      S.done[doneKey("after")] = true; save();
      R.missed = q.missed; R.phase = "result"; window.scrollTo(0, 0); break;
    }
    case "after-again": R.phase = "grammar"; R.quiz = null; R.missed = []; window.scrollTo(0, 0); break;
  }
  render();
});

/* ===== 暗号化データの読み込み ===== */
// data.bin は「先頭12バイト＝IV、残り＝AES-GCMの暗号文」。鍵は合言葉から PBKDF2 で作る
const enc = new TextEncoder();
const idb = (mode, fn) => new Promise((res, rej) => {
  const r = indexedDB.open("anime-eigo", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => {
    const tx = r.result.transaction("kv", mode), q = fn(tx.objectStore("kv"));
    tx.oncomplete = () => res(q && q.result);
    tx.onerror = () => rej(tx.error);
  };
  r.onerror = () => rej(r.error);
});
const getKey = () => idb("readonly", st => st.get("key")).catch(() => null);
const putKey = k => idb("readwrite", st => st.put(k, "key")).catch(() => {});
async function deriveKey(pass, cfg) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const salt = Uint8Array.from(atob(cfg.salt), ch => ch.charCodeAt(0));
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: cfg.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function decryptData(key) {
  const res = await fetch("data.bin");
  if (!res.ok) throw new Error("fetch data.bin");
  const buf = new Uint8Array(await res.arrayBuffer());
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
}

function start(buf) {
  EPISODES = JSON.parse(new TextDecoder().decode(buf)).episodes;
  if (!EPISODES.some(e => e.id === S.ep)) S.ep = EPISODES[0].id;
  document.getElementById("head").hidden = false;
  document.getElementById("steps").hidden = false;
  render();
}

function lockScreen() {
  document.getElementById("view").innerHTML = `
    <section class="lock">
      <h1>アニメ英語ノート</h1>
      <p>最初の1回だけ、合言葉を入れてください。この端末では次から自動で開きます。</p>
      <input id="pass" class="pass" type="password" autocomplete="current-password" placeholder="合言葉" aria-label="合言葉">
      <button class="btn primary" id="open">開く</button>
      <p class="note" id="err" aria-live="polite"></p>
    </section>`;
  const input = document.getElementById("pass"), err = document.getElementById("err");
  const go = async () => {
    if (!input.value.trim()) return;
    err.textContent = "確かめています…";
    try {
      const cfg = await (await fetch("config.json")).json();
      const k = await deriveKey(input.value.trim(), cfg);
      const data = await decryptData(k);
      await putKey(k);
      start(data);
    } catch (e) {
      err.textContent = navigator.onLine === false ? "最初の1回は、ネットにつながった状態で開いてください。" : "合言葉が違います。もう一度入れてください。";
    }
  };
  input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  document.getElementById("open").addEventListener("click", go);
}

(async () => {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const k = await getKey();
  if (k) {
    try { start(await decryptData(k)); return; } catch (e) {}
  }
  lockScreen();
})();

/* ===== 更新（新しい話が届いたら知らせる） ===== */
let wantReload = false;
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    const offer = w => {
      if (document.querySelector(".update")) return;
      const bar = document.createElement("div");
      bar.className = "update"; bar.setAttribute("role", "status");
      bar.innerHTML = '<span>新しい話が届きました</span><button class="btn primary">反映する</button>';
      bar.querySelector("button").addEventListener("click", () => { wantReload = true; w.postMessage("skip"); });
      document.body.append(bar);
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => {
      const w = reg.installing;
      if (w) w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) offer(w); });
    });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
  // 「反映する」を押したときだけ読み込み直す
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (wantReload) { wantReload = false; location.reload(); } });
}
})();
